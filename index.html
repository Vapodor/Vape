            ['airflow', /air ?flow|flux d.air/i],
            ['format', /format|cell\b/i]
        ];

        const detectProductType = (name, text) => {
            const hay = (n) => (String(name).match(n) || []).length * 3 + (String(text).match(n) || []).length;
            const scores = {
                disposable: hay(/disposable|jetable|puffs?\b|bouff[ée]es?/gi) * 2,
                pod: hay(/\bpods?\b/gi),
                mod: hay(/box ?mod|\bmod\b|dual 18650/gi) * 2,
                atomizer: hay(/atomi[sz]er|clearomi[sz]er|\btank\b|atomiseur/gi) * 1.5,
                coil: hay(/\bcoils?\b|r[ée]sistances? de remplacement|replacement coil/gi),
                battery: hay(/\baccus?\b|batterie|\bbattery\b|18650|20700|21700/gi) * 0.5,
                charger: hay(/chargeur|charger/gi) * 2,
                eliquid: hay(/e-?liquid|e-?liquide|\bPG\/VG|VG\/PG/gi),
                diy: hay(/ar[ôo]me|aroma|concentr|booster|shortfill|\bDIY\b/gi)
            };
            let best = '', bestScore = 0;
            Object.entries(scores).forEach(([t, sc]) => { if (sc > bestScore) { best = t; bestScore = sc; } });
            return best;
        };

        const extractSpecsFromText = (text, name, currentType) => {
            const type = currentType || detectProductType(name, text);
            const found = {};      // clé -> valeur
            const custom = [];     // lignes « Libellé : valeur » non reconnues
            const clean = (v) => String(v).replace(/\s+/g, ' ').trim();

            // 1) lignes « Libellé : valeur »
            text.split(/\r?\n/).forEach(line => {
                if (/https?:\/\//i.test(line)) return;
                const m = line.match(/^\s*[-•*]?\s*([^:：\t|]{2,40}?)\s*[:：\t|]\s*(.{1,80})$/);
                if (!m) return;
                const label = clean(m[1]), value = clean(m[2]);
                const hit = SPEC_LINE_KEYS.find(([, re]) => re.test(label));
                if (hit) { if (!found[hit[0]]) found[hit[0]] = value; }
                else if (label.length <= 32 && value.length <= 60 && !/^(package|in the box|contenu)/i.test(label)) custom.push({ label, value });
            });

            // 2) valeurs repérées dans le texte libre
            const grab = (key, re, fmt) => { if (found[key]) return; const m = text.match(re); if (m) found[key] = fmt(m); };
            const n = (x) => String(x).replace(',', '.');
            grab('battery_mah', /(\d[\d\s.,]{2,6})\s?mAh/i, m => clean(m[1]).replace(/[\s.,]/g, '') + ' mAh');
            grab('power_w', /(\d{1,3}(?:[.,]\d+)?)\s?(?:-|–|to|à)\s?(\d{1,3}(?:[.,]\d+)?)\s?W\b/i, m => `${n(m[1])}-${n(m[2])} W`);
            grab('power_w', /(\d{1,3}(?:[.,]\d+)?)\s?W\b/, m => `${n(m[1])} W`);
            grab('ohm', /(\d+(?:[.,]\d+)?)\s?(?:Ω|ohms?)(?![a-z])/i, m => `${n(m[1])} Ω`);
            grab('capacity_ml', /(\d+(?:[.,]\d+)?)\s?ml\b/i, m => `${n(m[1])} ml`);
            grab('diameter_mm', /(?:diam[eè]tre|diameter)\D{0,12}(\d{1,2}(?:[.,]\d+)?)\s?mm/i, m => `${n(m[1])} mm`);
            if (/PG|VG/.test(text)) grab('pgvg', /\b(\d{2})\s?\/\s?(\d{2})\b/, m => `${m[1]}/${m[2]}`);
            grab('format', /(\d)\s?[x×]\s?(18650|20700|21700)/i, m => `${m[1]} × ${m[2]}`);
            grab('format', /\b(18650|20700|21700)\b/, m => m[1]);
            grab('charge', /(type-?c|usb-?c|micro-?usb)/i, m => /micro/i.test(m[1]) ? 'Micro-USB' : 'USB-C');
            if (!found.draw) { const d = [...new Set((text.match(/\b(MTL|RDL|DTL|RDTL)\b/gi) || []).map(x => x.toUpperCase()))]; if (d.length) found.draw = d.join(' / '); }
            grab('dimensions', /(\d{1,3}(?:[.,]\d+)?)\s?[x×*]\s?(\d{1,3}(?:[.,]\d+)?)(?:\s?[x×*]\s?(\d{1,3}(?:[.,]\d+)?))?\s?mm/i, m => [m[1], m[2], m[3]].filter(Boolean).map(n).join(' × ') + ' mm');
            grab('weight', /(?:weight|poids)\D{0,10}(\d{1,4}(?:[.,]\d+)?)\s?(g|kg)\b/i, m => `${n(m[1])} ${m[2]}`);
            grab('puffs', /(\d{2,5})\s?(?:puffs?|bouff[ée]es?)/i, m => m[1]);
            if (type === 'disposable') grab('nic', /(\d{1,2}(?:[.,]\d+)?)\s?mg(?:\/ml)?/i, m => `${n(m[1])} mg/ml`);

            // 3) résultats ordonnés selon les champs du type
            const items = Object.entries(found).map(([key, value]) => ({ key: 'spec', label: specLabelFor(key, type), value, checked: true }));
            const order = (PRODUCT_TYPES[type]?.fields || []).map(f => f.label);
            items.sort((a, b) => { const ia = order.indexOf(a.label), ib = order.indexOf(b.label); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
            const seen = new Set(items.map(it => norm(it.label)));
            custom.slice(0, 8).forEach(c => { if (!seen.has(norm(c.label))) { seen.add(norm(c.label)); items.push({ key: 'spec', label: c.label, value: c.value, checked: true }); } });

            // 4) contenu de la boîte
            const bm = text.match(/(?:package (?:list|includes?|contents?)|in the box|what'?s included|contenu(?: de la bo[iî]te| du pack| du colis)?)\s*[:：-]?\s*([\s\S]{5,400})/i);
            if (bm) {
                const box = bm[1].split(/\n\s*\n/)[0].replace(/\s*\n\s*/g, '\n').trim().slice(0, 300);
                if (box.length >= 5) items.push({ key: 'box', label: 'Contenu de la boîte', value: box, checked: true });
            }
            return { type, items };
        };

        const DIY_NICOTINES = ['0mg', '3mg', '6mg'];

                    if (res.error) {

                        if (fallbackRes.error) throw fallbackRes.error;

        const compressImage = (file, maxSize = 1200, quality = 0.82) => new Promise((resolve) => {
            if (!file.type.startsWith('image/') || file.type === 'image/gif' || file.type === 'image/svg+xml') return resolve(file);
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                URL.revokeObjectURL(url);
                const ratio = Math.min(1, maxSize / Math.max(img.width, img.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * ratio);
                canvas.height = Math.round(img.height * ratio);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                canvas.toBlob((blob) => {
                    if (!blob || blob.size >= file.size) return resolve(file);
                    resolve(blob);
                }, 'image/webp', quality);
            };
            img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
            img.src = url;
        });

        const uploadImageToSupabase = async (file) => {
            if (!file) return null;
            const body = await compressImage(file);
            const isOriginal = body === file;
            const ext = isOriginal ? (file.name.split('.').pop() || 'jpg') : (body.type === 'image/webp' ? 'webp' : 'png');
            const filePath = `${Date.now()}_${Math.random().toString(36).substring(2, 9)}.${ext}`;

            const { error } = await supabaseClient.storage
                .from(MEDIA_BUCKET)
                .upload(filePath, body, { contentType: body.type || undefined, cacheControl: '31536000' });

            if (error) {
                alert("Erreur d'upload image : " + error.message);
                return null;
            }

            const { data: publicUrlData } = supabaseClient.storage.from(MEDIA_BUCKET).getPublicUrl(filePath);
            return publicUrlData.publicUrl;
        };

                if (!loop) return;
                let raf = 0, last = 0;
                const tick = (t) => {
                    const el = ref.current;
                    if (el) {
                        const dt = last ? Math.min(t - last, 64) : 16;
                        const now = Date.now();
                        const half = el.scrollWidth / 2;
                        if (hovering.current || now < holdUntil.current) {
                            pos.current = el.scrollLeft;           // suit le doigt / la souris / les flèches
                        } else if (half > el.clientWidth) {
                            pos.current += dt * 0.04;              // ~40 px par seconde
                        }
                        if (half > 0) {
                            if (pos.current >= half) pos.current -= half;
                            if (pos.current < 0) pos.current += half;
                            if (!(hovering.current || now < holdUntil.current) || el.scrollLeft >= half || el.scrollLeft < 0) el.scrollLeft = pos.current;
                        }
                    }
                    last = t;
                    raf = requestAnimationFrame(tick);
                };
                raf = requestAnimationFrame(tick);
                return () => cancelAnimationFrame(raf);

                        <div className="p-3 sm:p-5 space-y-2.5">

                                <p className="text-[11px] sm:text-xs text-slate-400 line-clamp-2 leading-relaxed">{product.short_description}</p>

        function ProductModal({ product, brand, hideOutOfStock, selectedVarId, onSelectVariant, qty, onQty, onClose, onAdd, onCopyLink }) {
            const availableVariants = hideOutOfStock ? product.variants.filter(isInStock) : product.variants;
            const currentVariant = availableVariants.find(v => v.id === selectedVarId) || availableVariants[0] || {};
            const displayImage = currentVariant.image_url || product.main_image_url;
            const unavailable = !currentVariant.id || !isInStock(currentVariant);

            const specList = getSpecs(product);
            const typeLabel = PRODUCT_TYPES[product.product_type]?.label;

            return (
                <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4" onClick={onClose}>
                    <div className="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl max-w-xl w-full shadow-2xl space-y-6 max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
                        <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                            <div>
                                {brand && <span className="text-[10px] bg-teal-500/20 text-teal-400 px-2.5 py-0.5 rounded-full font-bold uppercase">{brand.name}</span>}

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div className="w-full h-48 sm:h-56 bg-white rounded-2xl border border-slate-800 flex items-center justify-center p-3 relative">
                                <img src={displayImage} alt={product.name} className="max-w-full max-h-full object-contain" />
                                {product.is_promo && <PromoBadge className="absolute top-2 left-2" />}
                                {currentVariant.id && !isInStock(currentVariant) && <span className="absolute top-2 right-2 bg-slate-800 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full">En rupture</span>}
                            </div>
                            <div className="space-y-3">
                                {product.short_description && <p className="text-xs text-slate-300 leading-relaxed">{product.short_description}</p>}
                                <div className="text-teal-400 font-black text-xl">{fmt((currentVariant.price || 0) * qty)} Ar</div>
                                <p className="text-xs font-bold text-slate-400">Statut : <span className={!unavailable ? "text-emerald-400" : "text-rose-400"}>{!unavailable ? "Disponible" : "En rupture de stock"}</span></p>

                                <div className="space-y-1 pt-1">
                                    {isSet(currentVariant.volume_ml) && (

                                            <span className="text-slate-400 font-bold">Contenance : </span>

                                        </div>

                                    {isSet(currentVariant.nicotine_level) && (
                                        <div className="text-xs bg-slate-950 border border-slate-800 px-3 py-1 rounded-xl">
                                            <span className="text-slate-400 font-bold">Taux de Nicotine : </span>
                                            <span className="text-indigo-300 font-extrabold">{currentVariant.nicotine_level}</span>
                                        </div>

                                    {currentFlavor && (
                                        <div className="text-xs bg-slate-950 border border-slate-800 px-3 py-1 rounded-xl">
                                            <span className="text-slate-400 font-bold">Saveur : </span>
                                            <span className="text-amber-300 font-extrabold">{currentFlavor}</span>
                                        </div>
                                    )}
                                    {isSet(currentVariant.ohm_value) && (
                                        <div className="text-xs bg-slate-950 border border-slate-800 px-3 py-1 rounded-xl">
                                            <span className="text-slate-400 font-bold">Résistance : </span>
                                            <span className="text-emerald-300 font-extrabold">{currentVariant.ohm_value}</span>
                                            {ohmHint(currentVariant.ohm_value) && <span className="block text-[10px] text-slate-400 font-normal mt-0.5">{ohmHint(currentVariant.ohm_value)}</span>}
                                        </div>
                                    )}
                                    {isSet(currentVariant.color_finish) && (
                                        <div className="text-xs bg-slate-950 border border-slate-800 px-3 py-1 rounded-xl">
                                            <span className="text-slate-400 font-bold">Coloris / Finition : </span>
                                            <span className="text-purple-300 font-extrabold">{currentVariant.color_finish}</span>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {availableVariants.length > 1 && (
                            <div className="space-y-1.5">
                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Choisir une déclinaison :</span>
                                <VariantSelector variants={availableVariants} currentId={currentVariant.id} onSelect={(id) => onSelectVariant(product.id, id)} size="md" />
                            </div>
                        )}

                        {(typeLabel || specList.length > 0) && (
                            <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2">
                                <div className="flex items-center justify-between gap-2">
                                    <h4 className="text-xs font-black uppercase text-indigo-400 tracking-wider">Caractéristiques</h4>
                                    {typeLabel && <span className="text-[10px] bg-indigo-500/10 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full font-bold">{typeLabel}</span>}
                                </div>
                                {specList.length > 0 && (
                                    <table className="w-full text-xs">
                                        <tbody className="divide-y divide-slate-800/60">
                                            {specList.map((sp, i) => (
                                                <tr key={i}>
                                                    <td className="py-1.5 pr-3 text-slate-400 font-bold align-top">{sp.label}</td>
                                                    <td className="py-1.5 text-slate-100 font-semibold text-right">{sp.value}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                )}
                            </div>
                        )}

                        {product.box_content && (
                            <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-1.5">
                                <h4 className="text-xs font-black uppercase text-teal-400 tracking-wider">Contenu de la boîte</h4>
                                <p className="text-xs text-slate-300 whitespace-pre-line leading-relaxed">{product.box_content}</p>
                            </div>
                        )}

                        <div className="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-800">
                            <div className="flex items-center space-x-3">
                                <span className="text-xs font-bold text-slate-400 uppercase">Quantité :</span>
                                <div className="flex items-center space-x-2">
                                    <button onClick={() => onQty(product.id, Math.max(1, qty - 1))} className="w-8 h-8 bg-slate-950 border border-slate-800 rounded-xl text-sm font-bold">-</button>
                                    <span className="text-sm font-bold text-teal-400 px-2">{qty}</span>
                                    <button onClick={() => onQty(product.id, qty + 1)} className="w-8 h-8 bg-slate-950 border border-slate-800 rounded-xl text-sm font-bold">+</button>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={onCopyLink} className="px-3 py-3 bg-slate-950 border border-slate-800 hover:bg-slate-800 text-slate-300 rounded-2xl text-[11px] font-bold transition" title="Copier le lien de ce produit">
                                    🔗 Lien
                                </button>
                                <button
                                    onClick={() => { onAdd(product, currentVariant, qty); onClose(); }}
                                    disabled={unavailable}
                                    className="px-6 py-3 bg-teal-500 hover:bg-teal-400 disabled:opacity-40 text-black rounded-2xl text-xs font-black uppercase tracking-wider transition shadow-lg shadow-teal-500/25">
                                    {unavailable ? 'Épuisé' : 'Ajouter au panier'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function FilterBar({ list, brands, filters, onChange }) {
            const brandIds = [...new Set(list.map(p => p.brand_id).filter(Boolean))].filter(id => brands.some(b => b.id === id));
            const types = [...new Set(list.map(p => p.product_type).filter(t => t && PRODUCT_TYPES[t]))];
            const uniq = (key) => [...new Set(list.flatMap(p => p.variants.map(v => v[key])).filter(isSet))]
                .sort((a, b) => (parseFloat(a) || 0) - (parseFloat(b) || 0));
            const nics = uniq('nicotine_level');
            const vols = uniq('volume_ml');
            const active = filters.brand || filters.type || filters.nic || filters.vol || filters.inStock || filters.sort;
            const sel = "bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-teal-500";
            if (list.length < 2) return null;
            return (
                <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-3 flex flex-wrap items-center gap-2">
                    <select value={filters.sort} onChange={e => onChange({ ...filters, sort: e.target.value })} className={sel}>
                        <option value="">Trier : par défaut</option>
                        <option value="price_asc">Prix croissant</option>
                        <option value="price_desc">Prix décroissant</option>
                        <option value="name">Nom A → Z</option>
                    </select>
                    {brandIds.length > 1 && (
                        <select value={filters.brand} onChange={e => onChange({ ...filters, brand: e.target.value })} className={sel}>
                            <option value="">Toutes les marques</option>
                            {brandIds.map(id => <option key={id} value={id}>{brands.find(b => b.id === id).name}</option>)}
                        </select>
                    )}
                    {types.length > 1 && (
                        <select value={filters.type} onChange={e => onChange({ ...filters, type: e.target.value })} className={sel}>
                            <option value="">Tous les types</option>
                            {types.map(t => <option key={t} value={t}>{PRODUCT_TYPES[t].label}</option>)}
                        </select>
                    )}
                    {nics.length > 0 && (
                        <select value={filters.nic} onChange={e => onChange({ ...filters, nic: e.target.value })} className={sel}>
                            <option value="">Toute nicotine</option>
                            {nics.map(n => <option key={n} value={n}>{n}</option>)}
                        </select>
                    )}
                    {vols.length > 0 && (
                        <select value={filters.vol} onChange={e => onChange({ ...filters, vol: e.target.value })} className={sel}>
                            <option value="">Tous volumes</option>
                            {vols.map(v => <option key={v} value={v}>{v}</option>)}
                        </select>
                    )}
                    <label className="flex items-center space-x-1.5 text-xs text-slate-300 cursor-pointer px-1">
                        <input type="checkbox" checked={filters.inStock} onChange={e => onChange({ ...filters, inStock: e.target.checked })} className="accent-teal-500" />
                        <span>En stock</span>
                    </label>
                    {active && (
                        <button onClick={() => onChange(DEFAULT_FILTERS)} className="px-3 py-2 text-xs font-bold text-rose-400 hover:text-rose-300">Réinitialiser</button>
                    )}
                </div>
            );
        }

        function CategoryTreeItem({ category, categories, depth = 0, onAddChild, onEdit, onDelete, onMove }) {
            const subCats = categories.filter(sub => sub.parent_id === category.id);
            return (
                <div className="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2">
                    <div className="flex items-center justify-between flex-wrap gap-2">
                        <div className="flex items-center space-x-2">
                            <div className="flex flex-col space-y-0.5">
                                <button onClick={() => onMove(category, -1)} className="text-[9px] bg-slate-900 hover:bg-slate-800 text-slate-300 px-1 rounded border border-slate-800" title="Monter">▲</button>
                                <button onClick={() => onMove(category, 1)} className="text-[9px] bg-slate-900 hover:bg-slate-800 text-slate-300 px-1 rounded border border-slate-800" title="Descendre">▼</button>
                            </div>
                            <div className="w-8 h-8 rounded-lg border border-slate-800 bg-white flex items-center justify-center p-0.5">
                                <img src={category.image} alt={category.name} className="max-w-full max-h-full object-contain" />
                            </div>
                            <span className={`font-extrabold text-xs ${depth === 0 ? 'text-teal-400' : 'text-slate-200'}`}>
                                {depth > 0 && <span className="text-slate-500 mr-1">↳</span>}
                                {category.name} <span className="text-[10px] text-slate-500 font-normal">(Ordre: {category.display_order ?? 0})</span>
                            </span>
                        </div>
                        <div className="flex items-center space-x-1">
                            <button onClick={() => onAddChild(category)} className="px-2 py-1 bg-teal-500/10 text-teal-400 rounded-lg text-[10px] font-bold border border-teal-500/20">
                                + Enfant
                            </button>
                            <button onClick={() => onEdit(category)} className="px-2 py-1 bg-amber-500/10 text-amber-400 rounded-lg text-[10px] font-bold">
                                Editer
                            </button>
                            <button onClick={() => onDelete(category.id)} className="px-2 py-1 bg-rose-500/10 text-rose-400 rounded-lg text-[10px] font-bold">
                                Supprimer
                            </button>
                        </div>
                    </div>

                    {subCats.length > 0 && (
                        <div className="pl-4 border-l-2 border-slate-800 space-y-2 pt-1">
                            {subCats.map(sub => (
                                <CategoryTreeItem key={sub.id} category={sub} categories={categories} depth={depth + 1} onAddChild={onAddChild} onEdit={onEdit} onDelete={onDelete} onMove={onMove} />
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // ====================================================================
        // Application
        // ====================================================================
        function App() {
            const [isAgeVerified, setIsAgeVerified] = useState(false);

            useEffect(() => {
                try {
                    if (localStorage.getItem('vapodor_age_verified') === 'true') setIsAgeVerified(true);
                } catch (e) {}
            }, []);

            const confirmAge = () => {
                try { localStorage.setItem('vapodor_age_verified', 'true'); } catch (e) {}
                setIsAgeVerified(true);
            };

            const [currentView, setCurrentView] = useState('home');
            const [selectedCategoryId, setSelectedCategoryId] = useState(null);
            const [selectedBrandId, setSelectedBrandId] = useState(null);

            const [searchQuery, setSearchQuery] = useState('');
            const [filters, setFilters] = useState(DEFAULT_FILTERS);
            const [showCartModal, setShowCartModal] = useState(false);
            const [selectedProductId, setSelectedProductId] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            const [loadError, setLoadError] = useState('');

            const [brands, setBrands] = useState([]);
            const [categories, setCategories] = useState([]);
            const [products, setProducts] = useState([]);
            const [settings, setSettings] = useState(DEFAULT_SETTINGS);
            const [site, setSite] = useState(mergeSite(null));
            const [pageKey, setPageKey] = useState('');
            const [menuOpen, setMenuOpen] = useState(false);

            // Modèle de prix DIY préconfiguré par volume et par taux de nicotine
            const [diyPresetPrices, setDiyPresetPrices] = useState(() => {
                try {
                    const saved = localStorage.getItem('vapodor_diy_preset_v2');
                    if (saved) return JSON.parse(saved);
                } catch (e) {}
                
                const def = {};
                ['10ml', '30ml', '50ml', '100ml', '200ml', '500ml'].forEach(vol => {
                    ['0mg', '3mg', '6mg'].forEach(nic => {
                        def[`${vol}_${nic}`] = '';
                    });
                });
                return def;
            });

            const hideOutOfStock = settings.hideOutOfStock;
            const isVisible = (p) => !hideOutOfStock || p.variants.some(isInStock);

            const loadDataFromSupabase = async () => {
                setIsLoading(true);
                setLoadError('');
                try {
                    const [bData, cData, pData, vData, sRes] = await Promise.all([
                        fetchAll('brands'),
                        fetchAll('categories'),
                        fetchAll('products'),
                        fetchAll('variants'),
                        supabaseClient.from('settings').select('*').eq('id', 1).maybeSingle()
                    ]);

                    setBrands(bData);
                    setCategories(sortCategories(cData));
                    setProducts(pData.map(p => ({
                        ...p,
                        variants: vData.filter(v => v.product_id === p.id)
                    })));

                    if (sRes.error) {
                        console.warn("Table 'settings' introuvable ou inaccessible :", sRes.error.message);
                    } else if (sRes.data) {
                        setSettings({
                            whatsappNumber: sRes.data.whatsapp_number || DEFAULT_SETTINGS.whatsappNumber,
                            whatsappMessage: sRes.data.whatsapp_message || DEFAULT_SETTINGS.whatsappMessage,
                            messengerUrl: sRes.data.messenger_url || DEFAULT_SETTINGS.messengerUrl,
                            hideOutOfStock: !!sRes.data.hide_out_of_stock
                        });
                        setSite(mergeSite(sRes.data.site));
                    }
                } catch (err) {
                    console.error("Erreur de chargement :", err);
                    setLoadError(err.message || 'Impossible de charger le catalogue.');
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                loadDataFromSupabase();
            }, []);

            const [adminUnlocked, setAdminUnlocked] = useState(false);
            useEffect(() => {
                supabaseClient.auth.getSession().then(({ data }) => setAdminUnlocked(!!data?.session));
                const { data: sub } = supabaseClient.auth.onAuthStateChange((_event, session) => setAdminUnlocked(!!session));
                return () => sub?.subscription?.unsubscribe();
            }, []);

            useEffect(() => {
                const handlePopState = (event) => {
                    setSelectedProductId(null);
                    setFilters(DEFAULT_FILTERS);
                    if (event.state) {
                        setCurrentView(event.state.view || 'home');
                        setSelectedCategoryId(event.state.categoryId || null);
                        setSelectedBrandId(event.state.brandId || null);
                        setSearchQuery(event.state.searchQuery || '');
                        setPageKey(event.state.pageKey || '');
                    } else {
                        setCurrentView('home');
                        setSelectedCategoryId(null);
                        setSelectedBrandId(null);
                        setSearchQuery('');
                    }
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            const navigateTo = (view, catId = null, brandId = null, query = '') => {
                window.history.pushState({ view, categoryId: catId, brandId, searchQuery: query }, '', `#${view}`);
                setFilters(DEFAULT_FILTERS);
                setSelectedProductId(null);
                setCurrentView(view);
                setSelectedCategoryId(catId);
                setSelectedBrandId(brandId);
                if (query !== '') setSearchQuery(query);
                window.scrollTo(0, 0);
            };

            const openPage = (key) => {
                window.history.pushState({ view: 'page', pageKey: key }, '', `#${key}`);
                setSelectedProductId(null);
                setCurrentView('page');
                setPageKey(key);
                window.scrollTo(0, 0);
            };

            const openProduct = (id) => {
                setSelectedProductId(id);
                try { window.history.replaceState(window.history.state, '', `#produit/${encodeURIComponent(id)}`); } catch (e) {}
            };
            const closeProduct = () => {
                setSelectedProductId(null);
                try { window.history.replaceState(window.history.state, '', `#${currentView}`); } catch (e) {}
            };
            const copyProductLink = async () => {
                const url = window.location.href;
                try {
                    await navigator.clipboard.writeText(url);
                    alert('Lien du produit copié !');
                } catch (e) {
                    prompt('Copiez le lien de ce produit :', url);
                }
            };

            const deepLinkDone = useRef(false);
            useEffect(() => {
                if (deepLinkDone.current || isLoading || products.length === 0) return;
                deepLinkDone.current = true;
                const m = window.location.hash.match(/^#produit\/(.+)$/);
                if (m) {
                    const id = decodeURIComponent(m[1]);
                    if (products.some(p => String(p.id) === id)) setSelectedProductId(products.find(p => String(p.id) === id).id);
                }
            }, [isLoading, products]);

            const handleSearchSubmit = (e) => {
                e.preventDefault();
                if (searchQuery.trim()) {
                    navigateTo('search', null, null, searchQuery);
                }
            };

            const [cart, setCart] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('vapodor_cart') || '[]');
                    return Array.isArray(saved) ? saved : [];
                } catch (e) { return []; }
            });
            useEffect(() => {
                try { localStorage.setItem('vapodor_cart', JSON.stringify(cart)); } catch (e) {}
            }, [cart]);

            const [cartNotice, setCartNotice] = useState(null);
            const [selectedVariantByProduct, setSelectedVariantByProduct] = useState({});
            const [quantityByProduct, setQuantityByProduct] = useState({});

            const onSelectVariant = (productId, variantId) => setSelectedVariantByProduct(prev => ({ ...prev, [productId]: variantId }));
            const onQty = (productId, qty) => setQuantityByProduct(prev => ({ ...prev, [productId]: qty }));

            // Recherche automatique sur internet (fonction Supabase "product-lookup")
            const lookupProductInfo = async () => {
                const name = (newProduct.name || '').trim();
                if (name.length < 2) return alert("Saisissez d'abord le nom du produit.");
                setLookupBusy(true);
                setLookupInfo(null);
                try {
                    const { data: sess } = await supabaseClient.auth.getSession();
                    const token = sess?.session?.access_token;
                    if (!token) return alert("Session expirée : reconnectez-vous à l'administration.");

                    const types = Object.fromEntries(Object.entries(PRODUCT_TYPES).map(([k, t]) => [k, { label: t.label, fields: t.fields.map(f => f.label) }]));
                    const res = await fetch(LOOKUP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, apikey: SUPABASE_ANON_KEY },
                        body: JSON.stringify({
                            name,
                            brand: brands.find(b => b.id === newProduct.brand_id)?.name || '',
                            category: categories.find(c => c.id === newProduct.category_id)?.name || '',
                            types
                        })
                    });
                    let payload = null;
                    try { payload = await res.json(); } catch (e) {}
                    if (res.status === 404) return alert("La recherche automatique n'est pas encore installée sur Supabase (fonction « product-lookup »). Utilisez la recherche manuelle en attendant.");
                    if (!res.ok || !payload?.ok) return alert('Recherche impossible : ' + (payload?.error || ('erreur ' + res.status)));

                    const d = payload.data || {};
                    const items = [];
                    const matchedBrand = d.brand ? brands.find(b => norm(b.name) === norm(d.brand)) : null;
                    if (matchedBrand) items.push({ key: 'brand', label: 'Marque', value: matchedBrand.name, checked: true });
                    if (d.short_description) items.push({ key: 'desc', label: 'Description', value: d.short_description, checked: true });
                    (d.specs || []).forEach(sp => items.push({ key: 'spec', label: sp.label, value: sp.value, checked: true }));
                    if (d.box_content) items.push({ key: 'box', label: 'Contenu de la boîte', value: d.box_content, checked: true });

                    setLookupInfo({ sources: payload.sources || [], confidence: d.confidence || 'low', notes: d.notes || '', brandName: !matchedBrand ? (d.brand || '') : '' });
                    if (items.length === 0) return alert("Aucune information trouvée pour ce nom. Essayez avec le nom complet (marque + modèle).");
                    setSpecImportType(d.type && PRODUCT_TYPES[d.type] ? d.type : '');
                    setSpecImportItems(items);
                } catch (err) {
                    alert('Erreur de connexion : ' + err.message);
                } finally {
                    setLookupBusy(false);
                }
            };

            const applySpecImport = () => {

                setNewProduct(prev => {
                    const specs = (prev.specs || []).map(sp => ({ ...sp }));
                    let box = prev.box_content;
                    let desc = prev.short_description;
                    let brandId = prev.brand_id;
                    chosen.forEach(it => {
                        if (it.key === 'desc') { if (!String(desc || '').trim()) desc = it.value; return; }
                        if (it.key === 'brand') { const b = brands.find(x => norm(x.name) === norm(it.value)); if (b && !brandId) brandId = b.id; return; }
                        if (it.key === 'box') { if (!String(box || '').trim()) box = it.value; return; }
                        const idx = specs.findIndex(sp => norm(sp.label) === norm(it.label));
                        if (idx >= 0) { if (!String(specs[idx].value || '').trim()) specs[idx].value = it.value; }
                        else specs.push({ label: it.label, value: it.value });
                    });
                    return { ...prev, specs, box_content: box, short_description: desc, brand_id: brandId, product_type: prev.product_type || specImportType || '' };

                setSpecImportItems([]);
                setSpecImportText('');

            const changeProductType = (type) => {

            const addSpecRow = (label = '') => setNewProduct(prev => ({ ...prev, specs: [...(prev.specs || []), { label, value: '' }] }));

            const removeSpecRow = (i) => setNewProduct(prev => ({ ...prev, specs: prev.specs.filter((_, n) => n !== i) }));

            const handleLocalImageUpload = async (e) => {

            const generateDiyVariants = () => {
                const activeVolumes = Object.keys(diySelectedVolumes).filter(k => diySelectedVolumes[k]);
                const activeNicotines = Object.keys(diySelectedNicotines).filter(k => diySelectedNicotines[k]);

                if (activeVolumes.length === 0 && activeNicotines.length === 0) {
                    return alert('Veuillez sélectionner au moins un volume ou un taux de nicotine.');
                }

                const volumes = activeVolumes.length > 0 ? activeVolumes : ['-'];
                const nicotines = activeNicotines.length > 0 ? activeNicotines : ['-'];

                let basePrice = parseFloat(diyBasePrice);
                if (!diyUsePreset && (isNaN(basePrice) || basePrice < 0)) {
                    return alert('Veuillez saisir un prix de base valide.');
                }

                const newVariants = [];
                const missing = [];
                const stamp = Date.now().toString(36);
                let counter = 0;

                volumes.forEach(vol => {
                    nicotines.forEach(nic => {
                        let finalPrice = basePrice;
                        if (diyUsePreset) {
                            const presetValue = parseFloat(diyPresetPrices[`${vol}_${nic}`]);
                            if (isNaN(presetValue)) { missing.push(`${vol} / ${nic}`); return; }

                        newVariants.push({

            const handleSaveProduct = async (e) => {

                    price_table: filteredPriceTable

                const { error } = await supabaseClient.from('categories').upsert([catObj]);
                if (error) return alert('Erreur : ' + error.message);

                resetCategoryForm();
                alert('Rubrique enregistrée !');
                loadDataFromSupabase();
            };

            const startAddSubCategory = (parentCat) => {
                resetCategoryForm();
                setNewCatParent(parentCat.id);
            };

            const startEditCategory = (cat) => {
                setEditingCatId(cat.id);
                setNewCatName(cat.name);
                setNewCatParent(cat.parent_id || '');
                setNewCatImage(cat.image || DEFAULT_CAT_IMG);
                setNewCatOrder(String(cat.display_order ?? 0));
                setNewCatPriceTable(cat.price_table && cat.price_table.length > 0 ? cat.price_table : [{ label: '', price: '' }]);
            };

            const moveCategoryOrder = async (cat, direction) => {
                const siblings = sortCategories(categories.filter(c => (c.parent_id || null) === (cat.parent_id || null)));
                const idx = siblings.findIndex(c => c.id === cat.id);
                const target = idx + direction;
                if (idx < 0 || target < 0 || target >= siblings.length) return;

                const reordered = siblings.slice();
                [reordered[idx], reordered[target]] = [reordered[target], reordered[idx]];

                // Affichage immédiat, puis enregistrement
                const newOrderById = {};
                reordered.forEach((c, i) => { newOrderById[c.id] = i; });
                setCategories(prev => sortCategories(prev.map(c => c.id in newOrderById ? { ...c, display_order: newOrderById[c.id] } : c)));

                const jobs = reordered
                    .filter((c, i) => (c.display_order ?? 0) !== i || c.id === cat.id)
                    .map(c => supabaseClient.from('categories').update({ display_order: newOrderById[c.id] }).eq('id', c.id));
                const results = await Promise.all(jobs);
                const failed = results.find(r => r.error);
                if (failed) alert("Erreur lors de la modification de l'ordre : " + failed.error.message + "\n(La colonne display_order existe-t-elle dans Supabase ?)");
                loadDataFromSupabase();
            };

            const deleteCategory = async (id) => {
                const cat = categories.find(c => c.id === id);
                const newParent = cat?.parent_id || null;
                const childCount = categories.filter(c => c.parent_id === id).length;
                const prodCount = products.filter(p => p.category_id === id).length;
                if (!confirm(`Supprimer cette rubrique ?\n- ${childCount} sous-dossier(s) et ${prodCount} produit(s) seront remontés ${newParent ? 'dans le dossier parent' : 'à la racine / non classés'}.`)) return;

                const { error: e1 } = await supabaseClient.from('categories').update({ parent_id: newParent }).eq('parent_id', id);
                if (e1) return alert('Erreur : ' + e1.message);
                const { error: e2 } = await supabaseClient.from('products').update({ category_id: newParent }).eq('category_id', id);
                if (e2) return alert('Erreur : ' + e2.message);
                const { error } = await supabaseClient.from('categories').delete().eq('id', id);
                if (error) return alert('Erreur suppression de la rubrique : ' + error.message);

                if (editingCatId === id) resetCategoryForm();
                loadDataFromSupabase();
            };

            const [bulkBrandId, setBulkBrandId] = useState('');
            const [bulkCategoryId, setBulkCategoryId] = useState('');
            const [bulkValue, setBulkValue] = useState('');
            const [bulkBusy, setBulkBusy] = useState(false);

            // Configurateur de tableau de prix d'un dossier (affiché en haut de la page du dossier)
            const [ptCatId, setPtCatId] = useState('');
            const [ptRows, setPtRows] = useState([{ label: '', price: '' }]);
            const [ptBusy, setPtBusy] = useState(false);

            const selectPriceTableCategory = (catId) => {
                setPtCatId(catId);
                const cat = categories.find(c => c.id === catId);
                const rows = cat && Array.isArray(cat.price_table) && cat.price_table.length > 0
                    ? cat.price_table.map(r => ({ label: r.label || '', price: r.price ?? '' }))
                    : [{ label: '', price: '' }];
                setPtRows(rows);
            };

            const savePriceTable = async (rows, successMessage) => {
                if (!ptCatId) return alert('Veuillez choisir un dossier.');
                setPtBusy(true);
                try {
                    const { error } = await supabaseClient.from('categories').update({ price_table: rows }).eq('id', ptCatId);
                    if (error) return alert('Erreur : ' + error.message);
                    alert(successMessage);
                    await loadDataFromSupabase();
                    if (rows.length === 0) setPtRows([{ label: '', price: '' }]);
                } finally {
                    setPtBusy(false);
                }
            };

            const handleSavePriceTable = () => {
                const rows = ptRows
                    .map(r => ({ label: r.label.trim(), price: String(r.price).trim() }))
                    .filter(r => r.label !== '' || r.price !== '');
                if (rows.length === 0) return alert('Ajoutez au moins une ligne, ou utilisez « Retirer le tableau ».');
                if (rows.some(r => r.label === '')) return alert('Chaque ligne doit avoir une désignation.');
                savePriceTable(rows, 'Tableau de prix enregistré ! Il s\'affiche en haut de la page du dossier.');
            };

            const handleDeletePriceTable = () => {
                if (!confirm('Retirer le tableau de prix de ce dossier ?')) return;

            // Application du modèle de prix DIY à tous les produits d'un dossier
            const [diyBulkCatId, setDiyBulkCatId] = useState('');
            const [diyBulkVols, setDiyBulkVols] = useState(() => Object.fromEntries(DIY_VOLUMES.map(v => [v, true])));
            const [diyBulkNics, setDiyBulkNics] = useState(() => Object.fromEntries(DIY_NICOTINES.map(n => [n, true])));
            const [diyBulkBusy, setDiyBulkBusy] = useState(false);

            const handleApplyDiyToCategory = async () => {
                if (!diyBulkCatId) return alert('Choisissez le dossier cible (ex : E-liquide DIY).');
                const vols = DIY_VOLUMES.filter(v => diyBulkVols[v]);
                const nics = DIY_NICOTINES.filter(n => diyBulkNics[n]);

                const combos = [];
                vols.forEach(vol => nics.forEach(nic => {
                    const price = parseFloat(diyPresetPrices[`${vol}_${nic}`]);
                    if (!isNaN(price) && price >= 0) combos.push({ vol, nic, price });
                }));
                if (combos.length === 0) return alert("Aucun prix défini pour ces choix. Renseignez d'abord le modèle de prix (onglet 4).");

                const catIds = getAllChildCategoryIds(diyBulkCatId);
                const targets = products.filter(p => catIds.includes(p.category_id));
                if (targets.length === 0) return alert('Aucun produit dans ce dossier.');

                const updates = new Map(); // prix -> identifiants de déclinaisons à mettre à jour
                const creations = [];
                let updateCount = 0;
                targets.forEach(p => combos.forEach(({ vol, nic, price }) => {
                    const matches = p.variants.filter(v => v.volume_ml === vol && v.nicotine_level === nic);
                    if (matches.length > 0) {
                        matches.forEach(v => {
                            if ((Number(v.price) || 0) === price) return;
                            if (!updates.has(price)) updates.set(price, []);
                            updates.get(price).push(v.id);
                            updateCount++;
                        });
                    } else {
                        creations.push({
                            id: `var_${p.id}_diy_${vol}_${nic}`,
                            product_id: p.id,
                            price,
                            stock: 100,
                            nicotine_level: nic,
                            volume_ml: vol,
                            ohm_value: '-',
                            color_finish: '-',
                            flavor: '-',
                            image_url: ''
                        });
                    }
                }));

                if (updateCount === 0 && creations.length === 0) return alert('Tous les produits de ce dossier ont déjà ces prix.');
                if (!confirm(`${targets.length} produit(s) dans ce dossier :\n- ${updateCount} prix mis à jour\n- ${creations.length} déclinaison(s) créée(s)\nLes autres déclinaisons ne sont pas modifiées.\nConfirmer ?`)) return;

                setDiyBulkBusy(true);
                try {
                    const jobs = [];
                    updates.forEach((ids, price) => {
                        for (let i = 0; i < ids.length; i += 100) {
                            jobs.push(supabaseClient.from('variants').update({ price }).in('id', ids.slice(i, i + 100)));
                        }
                    });
                    for (let i = 0; i < creations.length; i += 200) {
                        jobs.push(supabaseClient.from('variants').upsert(creations.slice(i, i + 200)));
                    }
                    const results = await Promise.all(jobs);
                    const failed = results.filter(r => r.error);
                    if (failed.length > 0) {
                        alert(`Terminé avec ${failed.length} erreur(s) : ${failed[0].error.message}`);
                    } else {
                        alert(`Modèle DIY appliqué : ${updateCount} prix mis à jour, ${creations.length} déclinaison(s) créée(s).`);
                    }
                } catch (err) {
                    alert('Erreur : ' + err.message);
                } finally {
                    setDiyBulkBusy(false);
                    loadDataFromSupabase();
                }
            };


            const handleBulkPriceUpdate = async (e) => {
                e.preventDefault();
                const newPrice = parseFloat(bulkValue);
                if (isNaN(newPrice) || newPrice < 0) return alert('Veuillez saisir un prix valide.');
                if (!bulkBrandId && !bulkCategoryId) {
                    return alert('Veuillez sélectionner au moins une marque ou un dossier cible.');

                let targetProducts = products;

                if (bulkCategoryId) {

                    targetProducts = targetProducts.filter(p => validCatIds.includes(p.category_id));

                if (targetProducts.length === 0) return alert('Aucun produit ne correspond à ces critères.');

                const changes = new Map();
                let count = 0;
                targetProducts.forEach(prod => prod.variants.forEach(v => {
                    if ((Number(v.price) || 0) === newPrice) return;
                    if (!changes.has(newPrice)) changes.set(newPrice, []);
                    changes.get(newPrice).push(v.id);
                    count++;
                }));

                if (count === 0) return alert('Tous les produits ciblés ont déjà ce prix.');
                if (!confirm(`Le prix de ${count} déclinaison(s) (${targetProducts.length} produit(s)) sera fixé à ${fmt(newPrice)} Ar.\nConfirmer ?`)) return;

                setBulkBusy(true);
                try {
                    const jobs = [];
                    changes.forEach((ids, price) => {
                        for (let i = 0; i < ids.length; i += 100) {
                            jobs.push(supabaseClient.from('variants').update({ price }).in('id', ids.slice(i, i + 100)));
                        }
                    });
                    const results = await Promise.all(jobs);
                    const failed = results.filter(r => r.error);
                    if (failed.length > 0) {
                        alert(`Terminé avec ${failed.length} erreur(s).`);
                    } else {
                        alert(`Changement collectif effectué : ${count} déclinaison(s) mise(s) à jour.`);
                        setBulkValue('');
                    }
                } catch (err) {
                    alert('Erreur : ' + err.message);
                } finally {
                    setBulkBusy(false);
                    loadDataFromSupabase();
                }
            };

            const queryWords = norm(searchQuery).trim().split(/\s+/).filter(Boolean);

            const gridClass = "grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6";

            const renderAdminProductRow = (p) => (

                        </div>
                        <div>
                            <h4 className="font-bold text-xs text-slate-200">{p.is_featured && <span className="text-teal-400 mr-1">★</span>}{p.is_promo && <span className="text-rose-400 mr-1">%</span>}{p.name}</h4>
                            <p className="text-[10px] text-slate-400">{p.variants.length} option(s) tarifaire(s)</p>
                        </div>
                    </div>
                    <div className="flex items-center space-x-2">
                        <button onClick={() => toggleFeatured(p, 'is_promo')} title="Promotion" className={`px-2.5 py-1 border rounded-lg text-xs font-bold ${p.is_promo ? 'bg-rose-500 text-white border-rose-500' : 'bg-slate-950 text-slate-400 border-slate-800'}`}>%</button>
                        <button onClick={() => toggleFeatured(p)} title="Meilleure vente" className={`px-2.5 py-1 border rounded-lg text-xs font-bold ${p.is_featured ? 'bg-teal-500 text-black border-teal-500' : 'bg-slate-950 text-slate-400 border-slate-800'}`}>★</button>
                        <button onClick={() => startEditProduct(p)} className="px-2.5 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-lg text-xs font-bold">Modifier</button>

                    </div>

            const excludedParentIds = editingCatId ? getAllChildCategoryIds(editingCatId) : [];

            return (
                <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">
                    {!isAgeVerified && (

                                <div className="w-16 h-16 rounded-2xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center mx-auto text-rose-500 font-black text-2xl">
                                    18+

                                    <h2 className="text-xl font-black text-slate-100">Avertissement Légal</h2>
                                    <p className="text-xs text-slate-400 leading-relaxed">
                                        Les produits contenus sur <strong className="text-teal-400">Vapo d'Or</strong> sont strictement réservés aux personnes majeures.
                                    </p>

                                        J'ai 18 ans ou plus (Entrer)

                                        Quitter le site

                    {site.announcement && (

                                                Enregistrer ce modèle de prix complet
                                            </button>
                                        </div>

                                        <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl space-y-6">
                                            <h3 className="text-sm font-bold uppercase text-indigo-400">Paramètres Généraux & Commandes</h3>

                                            <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex items-center justify-between gap-3">
                                                <div>
                                                    <h4 className="text-xs font-bold text-slate-200">Masquer les produits en rupture</h4>
                                                    <p className="text-[10px] text-slate-400">Cache automatiquement les déclinaisons ou produits épuisés.</p>
                                                </div>
                                                <input
                                                    type="checkbox"
                                                    checked={settings.hideOutOfStock}
                                                    onChange={e => setSettings({ ...settings, hideOutOfStock: e.target.checked })}
                                                    className="w-5 h-5 accent-teal-500 cursor-pointer shrink-0"
                                                />
                                            </div>

                                            <div className="space-y-4 pt-2">
                                                <div>
                                                    <label className="text-xs text-slate-400 font-bold uppercase">Numéro WhatsApp (+261...)</label>
                                                    <input type="text" value={settings.whatsappNumber} onChange={e => setSettings({ ...settings, whatsappNumber: e.target.value })} className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm" />
                                                </div>
                                                <div>
                                                    <label className="text-xs text-slate-400 font-bold uppercase">Message pré-rempli</label>
                                                    <textarea value={settings.whatsappMessage} onChange={e => setSettings({ ...settings, whatsappMessage: e.target.value })} className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm" rows="2"></textarea>
                                                </div>
                                                <div>
                                                    <label className="text-xs text-slate-400 font-bold uppercase">Lien Messenger</label>
                                                    <input type="text" value={settings.messengerUrl} onChange={e => setSettings({ ...settings, messengerUrl: e.target.value })} className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm" />
                                                </div>
                                            </div>

                                            <button onClick={handleSaveSettings} className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-black text-xs uppercase tracking-wider transition shadow-lg shadow-indigo-600/30">
                                                Enregistrer les paramètres
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {selectedProduct && (
                        <ProductModal
                            product={selectedProduct}
                            brand={brands.find(b => b.id === selectedProduct.brand_id)}
                            hideOutOfStock={hideOutOfStock}
                            selectedVarId={selectedVariantByProduct[selectedProduct.id]}
                            onSelectVariant={onSelectVariant}
                            qty={quantityByProduct[selectedProduct.id] || 1}
                            onQty={onQty}
                            onClose={closeProduct}
                            onAdd={addToCart}
                            onCopyLink={copyProductLink}
                        />
                    )}

                    {showCartModal && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4" onClick={() => setShowCartModal(false)}>
                            <div className="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl max-w-lg w-full shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="text-base font-black text-slate-100 uppercase tracking-wider flex items-center space-x-2">
                                        <span>Mon Panier</span>
                                        <span className="text-xs bg-teal-500/20 text-teal-400 px-2 py-0.5 rounded-full">{cartCount}</span>
                                    </h3>
                                    <button onClick={() => setShowCartModal(false)} className="text-slate-400 hover:text-slate-100 font-bold text-lg">✕</button>
                                </div>

                                {cartLines.length === 0 ? (
                                    <div className="text-center py-8">
                                        <p className="text-xs text-slate-500">Votre panier est vide pour le moment.</p>
                                    </div>
                                ) : (
                                    <div className="space-y-3 max-h-64 overflow-y-auto pr-1">
                                        {cartLines.map(l => {
                                            const flavor = getFlavor(l.product, l.variant);
                                            const details = [];
                                            if (flavor) details.push(`Saveur: ${flavor}`);
                                            variantParts(l.variant).forEach(p => details.push(p));
                                            return (
                                                <div key={l.variantId} className="bg-slate-950 p-3 rounded-2xl border border-slate-800 flex justify-between items-center gap-3 text-xs">
                                                    <div className="min-w-0">
                                                        <p className="font-bold text-slate-200">{l.product.name}</p>
                                                        {details.length > 0 && <p className="text-slate-400 mt-0.5">{details.join(' | ')}</p>}
                                                        <p className="text-teal-400 font-black mt-1">{fmt(l.variant.price * l.quantity)} Ar</p>
                                                    </div>
                                                    <div className="flex items-center space-x-1.5 shrink-0">
                                                        <button onClick={() => changeCartQty(l.variantId, -1)} className="w-6 h-6 bg-slate-900 border border-slate-800 rounded-lg font-bold">-</button>
                                                        <span className="font-bold text-teal-400 w-5 text-center">{l.quantity}</span>
                                                        <button onClick={() => changeCartQty(l.variantId, 1)} className="w-6 h-6 bg-slate-900 border border-slate-800 rounded-lg font-bold">+</button>
                                                        <button onClick={() => removeFromCart(l.variantId)} className="w-6 h-6 rounded-lg bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white flex items-center justify-center font-bold transition ml-1">×</button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}

                                <div className="border-t border-slate-800 pt-3 flex justify-between items-center font-black text-base">
                                    <span className="text-slate-400">Total :</span>
                                    <span className="text-teal-400">{fmt(cartTotal)} Ar</span>
                                </div>

                                {cartNotice && (
                                    <div className="bg-teal-500/10 border border-teal-500/30 text-teal-200 rounded-2xl p-3 text-xs space-y-2">
                                        <p>{cartNotice.message}</p>
                                        {cartNotice.text && (
                                            <textarea readOnly value={cartNotice.text} rows="5" onFocus={(e) => e.target.select()} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-[11px] text-slate-200"></textarea>
                                        )}
                                    </div>
                                )}

                                <div className="space-y-2.5 pt-2">
                                    <button
                                        onClick={checkoutWhatsApp}
                                        disabled={cartLines.length === 0}
                                        className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white rounded-2xl font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-emerald-600/25 flex items-center justify-center space-x-2">
                                        <span>Commander via WhatsApp</span>
                                    </button>
                                    <button
                                        onClick={checkoutMessenger}
                                        disabled={cartLines.length === 0}
                                        className="w-full py-3.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white rounded-2xl font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-blue-600/25 flex items-center justify-center space-x-2">
                                        <span>Commander via Messenger</span>
                                    </button>
                                    {cartLines.length > 0 && (
                                        <button onClick={clearCart} className="w-full py-2 text-[11px] text-slate-500 hover:text-rose-400 font-bold transition">
                                            Vider le panier
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="border-t border-slate-800/80 bg-slate-900/60 mt-16">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-10 grid sm:grid-cols-2 lg:grid-cols-4 gap-8 text-xs text-slate-400">
                            <div className="space-y-3">
                                <VapoLogo />
                                <p className="leading-relaxed">{site.about_text}</p>
                            </div>
                            <div className="space-y-2">
                                <h4 className="font-display text-sm font-extrabold text-slate-100">Rubriques</h4>
                                {categories.filter(c => !c.parent_id).map(c => (
                                    <button key={c.id} onClick={() => navigateTo('category', c.id, null)} className="block hover:text-teal-400 transition text-left">{c.name}</button>
                                ))}
                            </div>
                            <div className="space-y-2">
                                <h4 className="font-display text-sm font-extrabold text-slate-100">Informations</h4>
                                {PAGE_LINKS.map(l => (
                                    <button key={l.key} onClick={() => openPage(l.key)} className="block hover:text-teal-400 transition text-left">{l.label}</button>
                                ))}
                            </div>
                            <div className="space-y-2">
                                <h4 className="font-display text-sm font-extrabold text-slate-100">Nous joindre</h4>
                                <a href={waLink("Bonjour Vapo d'Or, j'ai une question :")} target="_blank" rel="noopener noreferrer" className="block hover:text-teal-400 transition">WhatsApp : {settings.whatsappNumber}</a>
                                {settings.messengerUrl && <a href={settings.messengerUrl} target="_blank" rel="noopener noreferrer" className="block hover:text-teal-400 transition">Messenger</a>}
                                {site.facebook && <a href={site.facebook} target="_blank" rel="noopener noreferrer" className="block hover:text-teal-400 transition">Facebook</a>}
                                {site.instagram && <a href={site.instagram} target="_blank" rel="noopener noreferrer" className="block hover:text-teal-400 transition">Instagram</a>}
                                {site.email && <p>{site.email}</p>}
                                {site.address && <p>📍 {site.address}</p>}
                                {site.hours && <p>🕘 {site.hours}</p>}
                            </div>
                        </div>
                        <div className="border-t border-slate-800/80 py-4 px-4 text-center space-y-1">
                            <p className="text-[10px] text-slate-500">⚠ Produits réservés aux adultes (18+). La nicotine crée une forte dépendance.</p>
                            <p className="text-[10px] text-slate-600">© {new Date().getFullYear()} Vapo d'Or — Madagascar</p>
                            <button onClick={() => adminUnlocked ? navigateTo('admin') : setShowAuthModal(true)} className="text-[10px] text-slate-600 hover:text-slate-400 transition">
                                Espace d'Administration
                            </button>
                        </div>
                    </footer>

                    {settings.whatsappNumber && currentView !== 'admin' && (
                        <a href={waLink("Bonjour Vapo d'Or, j'ai une question :")} target="_blank" rel="noopener noreferrer" aria-label="Discuter sur WhatsApp" className="fixed bottom-5 right-4 z-30 w-14 h-14 rounded-full bg-emerald-500 hover:bg-emerald-400 text-white shadow-2xl shadow-emerald-500/30 flex items-center justify-center transition">
                            <svg className="w-7 h-7" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.700 6.700 0 01-3.300-2.900c-.2-.4.2-.4.7-1.300.1-.2 0-.3 0-.5l-.8-1.800c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.200c0 1.300.9 2.500 1 2.700.1.200 1.800 2.800 4.400 3.900 1.600.7 2.200.7 3 .6.500-.1 1.500-.6 1.700-1.200.2-.6.2-1.100.2-1.200-.1-.1-.3-.2-.5-.3z"/></svg>
                        </a>
                    )}

                    {showAuthModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl space-y-5">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-base font-black text-indigo-400 uppercase tracking-wider">Connexion Administrateur</h3>
                                    <button onClick={() => setShowAuthModal(false)} className="text-slate-400 hover:text-slate-100 font-bold">✕</button>
                                </div>
                                <form onSubmit={handleSupabaseLogin} className="space-y-4">
                                    <div>
                                        <label className="text-[11px] font-bold text-slate-400 uppercase">Identifiant / Email</label>
                                        <input type="email" value={adminEmail} onChange={e => setAdminEmail(e.target.value)} placeholder="admin@exemple.com" className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm" required />
                                    </div>
                                    <div>
                                        <label className="text-[11px] font-bold text-slate-400 uppercase">Mot de passe</label>
                                        <input type="password" value={adminPassword} onChange={e => setAdminPassword(e.target.value)} placeholder="••••••••" className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm" required />
                                    </div>
                                    {authError && <p className="text-xs text-rose-400">{authError}</p>}
                                    <button type="submit" className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-indigo-600/30">
                                        Se connecter
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
