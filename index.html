            const hay = (n) => (String(name).match(n) || []).length * 3 + (String(text).match(n) || []).length;
            const scores = {
                disposable: hay(/disposable|jetable|puffs?\b|bouff[ée]es?/gi) * 2,
                pod: hay(/\bpods?\b/gi),
                mod: hay(/box ?mod|\bmod\b|dual 18650/gi) * 2,
                atomizer: hay(/atomi[sz]er|clearomi[sz]er|\btank\b|atomiseur/gi) * 1.5,
                coil: hay(/\bcoils?\b|r[ée]sistances? de remplacement|replacement coil/gi),
                battery: hay(/\baccus?\b|batterie|\bbattery\b|18650|20700|21700/gi) * 0.5,
                charger: hay(/chargeur|charger/gi) * 2,
                eliquid: hay(/e-?liquid|e-?liquide|\bPG\/VG|VG\/PG/gi),
                diy: hay(/ar[ôo]me|aroma|concentr|booster|shortfill|\bDIY\b/gi)
            };
            let best = '', bestScore = 0;
            Object.entries(scores).forEach(([t, sc]) => { if (sc > bestScore) { best = t; bestScore = sc; } });
            return best;
        };

        const extractSpecsFromText = (text, name, currentType) => {
            const type = currentType || detectProductType(name, text);
            const found = {};      // clé -> valeur
            const custom = [];     // lignes « Libellé : valeur » non reconnues
            const clean = (v) => String(v).replace(/\s+/g, ' ').trim();

            // 1) lignes « Libellé : valeur »
            text.split(/\r?\n/).forEach(line => {
                if (/https?:\/\//i.test(line)) return;
                const m = line.match(/^\s*[-•*]?\s*([^:：\t|]{2,40}?)\s*[:：\t|]\s*(.{1,80})$/);
                if (!m) return;
                const label = clean(m[1]), value = clean(m[2]);
                const hit = SPEC_LINE_KEYS.find(([, re]) => re.test(label));
                if (hit) { if (!found[hit[0]]) found[hit[0]] = value; }
                else if (label.length <= 32 && value.length <= 60 && !/^(package|in the box|contenu)/i.test(label)) custom.push({ label, value });
            });

            // 2) valeurs repérées dans le texte libre
            const grab = (key, re, fmt) => { if (found[key]) return; const m = text.match(re); if (m) found[key] = fmt(m); };
            const n = (x) => String(x).replace(',', '.');
            grab('battery_mah', /(\d[\d\s.,]{2,6})\s?mAh/i, m => clean(m[1]).replace(/[\s.,]/g, '') + ' mAh');
            grab('power_w', /(\d{1,3}(?:[.,]\d+)?)\s?(?:-|–|to|à)\s?(\d{1,3}(?:[.,]\d+)?)\s?W\b/i, m => `${n(m[1])}-${n(m[2])} W`);
            grab('power_w', /(\d{1,3}(?:[.,]\d+)?)\s?W\b/, m => `${n(m[1])} W`);
            grab('ohm', /(\d+(?:[.,]\d+)?)\s?(?:Ω|ohms?)(?![a-z])/i, m => `${n(m[1])} Ω`);
            grab('capacity_ml', /(\d+(?:[.,]\d+)?)\s?ml\b/i, m => `${n(m[1])} ml`);
            grab('diameter_mm', /(?:diam[eè]tre|diameter)\D{0,12}(\d{1,2}(?:[.,]\d+)?)\s?mm/i, m => `${n(m[1])} mm`);
            if (/PG|VG/.test(text)) grab('pgvg', /\b(\d{2})\s?\/\s?(\d{2})\b/, m => `${m[1]}/${m[2]}`);
            grab('format', /(\d)\s?[x×]\s?(18650|20700|21700)/i, m => `${m[1]} × ${m[2]}`);
            grab('format', /\b(18650|20700|21700)\b/, m => m[1]);
            grab('charge', /(type-?c|usb-?c|micro-?usb)/i, m => /micro/i.test(m[1]) ? 'Micro-USB' : 'USB-C');
            if (!found.draw) { const d = [...new Set((text.match(/\b(MTL|RDL|DTL|RDTL)\b/gi) || []).map(x => x.toUpperCase()))]; if (d.length) found.draw = d.join(' / '); }
            grab('dimensions', /(\d{1,3}(?:[.,]\d+)?)\s?[x×*]\s?(\d{1,3}(?:[.,]\d+)?)(?:\s?[x×*]\s?(\d{1,3}(?:[.,]\d+)?))?\s?mm/i, m => [m[1], m[2], m[3]].filter(Boolean).map(n).join(' × ') + ' mm');
            grab('weight', /(?:weight|poids)\D{0,10}(\d{1,4}(?:[.,]\d+)?)\s?(g|kg)\b/i, m => `${n(m[1])} ${m[2]}`);
            grab('puffs', /(\d{2,5})\s?(?:puffs?|bouff[ée]es?)/i, m => m[1]);
            if (type === 'disposable') grab('nic', /(\d{1,2}(?:[.,]\d+)?)\s?mg(?:\/ml)?/i, m => `${n(m[1])} mg/ml`);

            // 3) résultats ordonnés selon les champs du type
            const items = Object.entries(found).map(([key, value]) => ({ key: 'spec', label: specLabelFor(key, type), value, checked: true }));
            const order = (PRODUCT_TYPES[type]?.fields || []).map(f => f.label);
            items.sort((a, b) => { const ia = order.indexOf(a.label), ib = order.indexOf(b.label); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
            const seen = new Set(items.map(it => norm(it.label)));
            custom.slice(0, 8).forEach(c => { if (!seen.has(norm(c.label))) { seen.add(norm(c.label)); items.push({ key: 'spec', label: c.label, value: c.value, checked: true }); } });

            // 4) contenu de la boîte
            const bm = text.match(/(?:package (?:list|includes?|contents?)|in the box|what'?s included|contenu(?: de la bo[iî]te| du pack| du colis)?)\s*[:：-]?\s*([\s\S]{5,400})/i);
            if (bm) {
                const box = bm[1].split(/\n\s*\n/)[0].replace(/\s*\n\s*/g, '\n').trim().slice(0, 300);
                if (box.length >= 5) items.push({ key: 'box', label: 'Contenu de la boîte', value: box, checked: true });
            }
            return { type, items };
        };

        const DIY_VOLUMES = ['10ml', '30ml', '50ml', '100ml', '200ml', '500ml'];
        const DIY_NICOTINES = ['0mg', '3mg', '6mg'];

        // Tri stable des rubriques selon l'ordre d'affichage choisi par l'administrateur

            let from = 0;

            while (true) {

                if (table === 'categories') {
                    const res = await supabaseClient.from(table).select('*').order('display_order', { ascending: true }).order('id').range(from, from + pageSize - 1);
                    if (res.error) {
                        const fallbackRes = await supabaseClient.from(table).select('*').order('id').range(from, from + pageSize - 1);
                        if (fallbackRes.error) throw fallbackRes.error;
                        data = fallbackRes.data;
                    } else {
                        data = res.data;
                    }
                } else {
                    const res = await supabaseClient.from(table).select('*').order('id').range(from, from + pageSize - 1);
                    if (res.error) throw res.error;
                    data = res.data;

                all = all.concat(data || []);

        const compressImage = (file, maxSize = 1200, quality = 0.82) => new Promise((resolve) => {
            if (!file.type.startsWith('image/') || file.type === 'image/gif' || file.type === 'image/svg+xml') return resolve(file);
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                URL.revokeObjectURL(url);
                const ratio = Math.min(1, maxSize / Math.max(img.width, img.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * ratio);
                canvas.height = Math.round(img.height * ratio);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                canvas.toBlob((blob) => {
                    if (!blob || blob.size >= file.size) return resolve(file);
                    resolve(blob);
                }, 'image/webp', quality);
            };
            img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
            img.src = url;
        });

        const uploadImageToSupabase = async (file) => {
            if (!file) return null;
            const body = await compressImage(file);
            const isOriginal = body === file;
            const ext = isOriginal ? (file.name.split('.').pop() || 'jpg') : (body.type === 'image/webp' ? 'webp' : 'png');
            const filePath = `${Date.now()}_${Math.random().toString(36).substring(2, 9)}.${ext}`;

            const { error } = await supabaseClient.storage
                .from(MEDIA_BUCKET)
                .upload(filePath, body, { contentType: body.type || undefined, cacheControl: '31536000' });

            if (error) {
                alert("Erreur d'upload image : " + error.message);
                return null;
            }

            const { data: publicUrlData } = supabaseClient.storage.from(MEDIA_BUCKET).getPublicUrl(filePath);
            return publicUrlData.publicUrl;
        };

        function NewArrivals({ list, brands, onOpen, onAll }) {
            const ref = useRef(null);
            const pos = useRef(0);
            const holdUntil = useRef(0);
            const hovering = useRef(false);
            const loop = list.length >= 3;
            const items = loop ? list.concat(list) : list;

            useEffect(() => {
                if (!loop) return;
                let raf = 0, last = 0;
                const tick = (t) => {
                    const el = ref.current;
                    if (el) {
                        const dt = last ? Math.min(t - last, 64) : 16;
                        const now = Date.now();
                        const half = el.scrollWidth / 2;
                        if (hovering.current || now < holdUntil.current) {
                            pos.current = el.scrollLeft;           // suit le doigt / la souris / les flèches
                        } else if (half > el.clientWidth) {
                            pos.current += dt * 0.04;              // ~40 px par seconde
                        }
                        if (half > 0) {
                            if (pos.current >= half) pos.current -= half;
                            if (pos.current < 0) pos.current += half;
                            if (!(hovering.current || now < holdUntil.current) || el.scrollLeft >= half || el.scrollLeft < 0) el.scrollLeft = pos.current;
                        }
                    }
                    last = t;
                    raf = requestAnimationFrame(tick);
                };
                raf = requestAnimationFrame(tick);
                return () => cancelAnimationFrame(raf);
            }, [loop, list.length]);

            const hold = (ms) => { holdUntil.current = Date.now() + ms; };
            const arrow = (dir) => {
                const el = ref.current; if (!el) return;

        function ProductModal({ product, brand, hideOutOfStock, selectedVarId, onSelectVariant, qty, onQty, onClose, onAdd, onCopyLink }) {
            const availableVariants = hideOutOfStock ? product.variants.filter(isInStock) : product.variants;
            const currentVariant = availableVariants.find(v => v.id === selectedVarId) || availableVariants[0] || {};
            const displayImage = currentVariant.image_url || product.main_image_url;

            const typeLabel = PRODUCT_TYPES[product.product_type]?.label;

            return (
                <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4" onClick={onClose}>
                    <div className="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl max-w-xl w-full shadow-2xl space-y-6 max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
                        <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                            <div>
                                {brand && <span className="text-[10px] bg-teal-500/20 text-teal-400 px-2.5 py-0.5 rounded-full font-bold uppercase">{brand.name}</span>}

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div className="w-full h-48 sm:h-56 bg-white rounded-2xl border border-slate-800 flex items-center justify-center p-3 relative">
                                <img src={displayImage} alt={product.name} className="max-w-full max-h-full object-contain" />
                                {product.is_promo && <PromoBadge className="absolute top-2 left-2" />}
                                {currentVariant.id && !isInStock(currentVariant) && <span className="absolute top-2 right-2 bg-slate-800 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full">En rupture</span>}
                            </div>
                            <div className="space-y-3">
                                {product.short_description && <p className="text-xs text-slate-300 leading-relaxed">{product.short_description}</p>}
                                <div className="text-teal-400 font-black text-xl">{fmt((currentVariant.price || 0) * qty)} Ar</div>
                                <p className="text-xs font-bold text-slate-400">Statut : <span className={!unavailable ? "text-emerald-400" : "text-rose-400"}>{!unavailable ? "Disponible" : "En rupture de stock"}</span></p>

                                <div className="space-y-1 pt-1">
                                    {isSet(currentVariant.volume_ml) && (

                                    {isSet(currentVariant.nicotine_level) && (

                                            <span className="text-slate-400 font-bold">Taux de Nicotine : </span>
                                            <span className="text-indigo-300 font-extrabold">{currentVariant.nicotine_level}</span>
                                        </div>

                                    {currentFlavor && (
                                        <div className="text-xs bg-slate-950 border border-slate-800 px-3 py-1 rounded-xl">
                                            <span className="text-slate-400 font-bold">Saveur : </span>
                                            <span className="text-amber-300 font-extrabold">{currentFlavor}</span>
                                        </div>
                                    )}
                                    {isSet(currentVariant.ohm_value) && (
                                        <div className="text-xs bg-slate-950 border border-slate-800 px-3 py-1 rounded-xl">
                                            <span className="text-slate-400 font-bold">Résistance : </span>
                                            <span className="text-emerald-300 font-extrabold">{currentVariant.ohm_value}</span>
                                            {ohmHint(currentVariant.ohm_value) && <span className="block text-[10px] text-slate-400 font-normal mt-0.5">{ohmHint(currentVariant.ohm_value)}</span>}
                                        </div>
                                    )}
                                    {isSet(currentVariant.color_finish) && (
                                        <div className="text-xs bg-slate-950 border border-slate-800 px-3 py-1 rounded-xl">
                                            <span className="text-slate-400 font-bold">Coloris / Finition : </span>
                                            <span className="text-purple-300 font-extrabold">{currentVariant.color_finish}</span>
                                        </div>
                                    )}

                            </div>
                        </div>

                        {availableVariants.length > 1 && (
                            <div className="space-y-1.5">
                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Choisir une déclinaison :</span>
                                <VariantSelector variants={availableVariants} currentId={currentVariant.id} onSelect={(id) => onSelectVariant(product.id, id)} size="md" />
                            </div>
                        )}

                        {(typeLabel || specList.length > 0) && (
                            <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2">
                                <div className="flex items-center justify-between gap-2">
                                    <h4 className="text-xs font-black uppercase text-indigo-400 tracking-wider">Caractéristiques</h4>
                                    {typeLabel && <span className="text-[10px] bg-indigo-500/10 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full font-bold">{typeLabel}</span>}
                                </div>
                                {specList.length > 0 && (
                                    <table className="w-full text-xs">
                                        <tbody className="divide-y divide-slate-800/60">
                                            {specList.map((sp, i) => (
                                                <tr key={i}>
                                                    <td className="py-1.5 pr-3 text-slate-400 font-bold align-top">{sp.label}</td>
                                                    <td className="py-1.5 text-slate-100 font-semibold text-right">{sp.value}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                )}
                            </div>
                        )}

                        {product.box_content && (
                            <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-1.5">
                                <h4 className="text-xs font-black uppercase text-teal-400 tracking-wider">Contenu de la boîte</h4>
                                <p className="text-xs text-slate-300 whitespace-pre-line leading-relaxed">{product.box_content}</p>
                            </div>
                        )}

                        <div className="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-800">
                            <div className="flex items-center space-x-3">
                                <span className="text-xs font-bold text-slate-400 uppercase">Quantité :</span>
                                <div className="flex items-center space-x-2">
                                    <button onClick={() => onQty(product.id, Math.max(1, qty - 1))} className="w-8 h-8 bg-slate-950 border border-slate-800 rounded-xl text-sm font-bold">-</button>
                                    <span className="text-sm font-bold text-teal-400 px-2">{qty}</span>
                                    <button onClick={() => onQty(product.id, qty + 1)} className="w-8 h-8 bg-slate-950 border border-slate-800 rounded-xl text-sm font-bold">+</button>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={onCopyLink} className="px-3 py-3 bg-slate-950 border border-slate-800 hover:bg-slate-800 text-slate-300 rounded-2xl text-[11px] font-bold transition" title="Copier le lien de ce produit">
                                    🔗 Lien
                                </button>
                                <button
                                    onClick={() => { onAdd(product, currentVariant, qty); onClose(); }}
                                    disabled={unavailable}
                                    className="px-6 py-3 bg-teal-500 hover:bg-teal-400 disabled:opacity-40 text-black rounded-2xl text-xs font-black uppercase tracking-wider transition shadow-lg shadow-teal-500/25">
                                    {unavailable ? 'Épuisé' : 'Ajouter au panier'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function FilterBar({ list, brands, filters, onChange }) {
            const brandIds = [...new Set(list.map(p => p.brand_id).filter(Boolean))].filter(id => brands.some(b => b.id === id));
            const types = [...new Set(list.map(p => p.product_type).filter(t => t && PRODUCT_TYPES[t]))];
            const uniq = (key) => [...new Set(list.flatMap(p => p.variants.map(v => v[key])).filter(isSet))]
                .sort((a, b) => (parseFloat(a) || 0) - (parseFloat(b) || 0));
            const nics = uniq('nicotine_level');
            const vols = uniq('volume_ml');
            const active = filters.brand || filters.type || filters.nic || filters.vol || filters.inStock || filters.sort;
            const sel = "bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-teal-500";
            if (list.length < 2) return null;
            return (
                <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-3 flex flex-wrap items-center gap-2">
                    <select value={filters.sort} onChange={e => onChange({ ...filters, sort: e.target.value })} className={sel}>
                        <option value="">Trier : par défaut</option>
                        <option value="price_asc">Prix croissant</option>
                        <option value="price_desc">Prix décroissant</option>
                        <option value="name">Nom A → Z</option>
                    </select>
                    {brandIds.length > 1 && (
                        <select value={filters.brand} onChange={e => onChange({ ...filters, brand: e.target.value })} className={sel}>
                            <option value="">Toutes les marques</option>
                            {brandIds.map(id => <option key={id} value={id}>{brands.find(b => b.id === id).name}</option>)}
                        </select>
                    )}
                    {types.length > 1 && (
                        <select value={filters.type} onChange={e => onChange({ ...filters, type: e.target.value })} className={sel}>
                            <option value="">Tous les types</option>
                            {types.map(t => <option key={t} value={t}>{PRODUCT_TYPES[t].label}</option>)}
                        </select>
                    )}
                    {nics.length > 0 && (
                        <select value={filters.nic} onChange={e => onChange({ ...filters, nic: e.target.value })} className={sel}>
                            <option value="">Toute nicotine</option>
                            {nics.map(n => <option key={n} value={n}>{n}</option>)}
                        </select>
                    )}
                    {vols.length > 0 && (
                        <select value={filters.vol} onChange={e => onChange({ ...filters, vol: e.target.value })} className={sel}>
                            <option value="">Tous volumes</option>
                            {vols.map(v => <option key={v} value={v}>{v}</option>)}
                        </select>
                    )}
                    <label className="flex items-center space-x-1.5 text-xs text-slate-300 cursor-pointer px-1">
                        <input type="checkbox" checked={filters.inStock} onChange={e => onChange({ ...filters, inStock: e.target.checked })} className="accent-teal-500" />
                        <span>En stock</span>
                    </label>
                    {active && (
                        <button onClick={() => onChange(DEFAULT_FILTERS)} className="px-3 py-2 text-xs font-bold text-rose-400 hover:text-rose-300">Réinitialiser</button>
                    )}
                </div>
            );
        }

        function CategoryTreeItem({ category, categories, depth = 0, onAddChild, onEdit, onDelete, onMove }) {
            const subCats = categories.filter(sub => sub.parent_id === category.id);
            return (
                <div className="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2">
                    <div className="flex items-center justify-between flex-wrap gap-2">
                        <div className="flex items-center space-x-2">
                            <div className="flex flex-col space-y-0.5">
                                <button onClick={() => onMove(category, -1)} className="text-[9px] bg-slate-900 hover:bg-slate-800 text-slate-300 px-1 rounded border border-slate-800" title="Monter">▲</button>
                                <button onClick={() => onMove(category, 1)} className="text-[9px] bg-slate-900 hover:bg-slate-800 text-slate-300 px-1 rounded border border-slate-800" title="Descendre">▼</button>
                            </div>
                            <div className="w-8 h-8 rounded-lg border border-slate-800 bg-white flex items-center justify-center p-0.5">
                                <img src={category.image} alt={category.name} className="max-w-full max-h-full object-contain" />
                            </div>
                            <span className={`font-extrabold text-xs ${depth === 0 ? 'text-teal-400' : 'text-slate-200'}`}>
                                {depth > 0 && <span className="text-slate-500 mr-1">↳</span>}
                                {category.name} <span className="text-[10px] text-slate-500 font-normal">(Ordre: {category.display_order ?? 0})</span>
                            </span>
                        </div>
                        <div className="flex items-center space-x-1">
                            <button onClick={() => onAddChild(category)} className="px-2 py-1 bg-teal-500/10 text-teal-400 rounded-lg text-[10px] font-bold border border-teal-500/20">
                                + Enfant
                            </button>
                            <button onClick={() => onEdit(category)} className="px-2 py-1 bg-amber-500/10 text-amber-400 rounded-lg text-[10px] font-bold">
                                Editer
                            </button>
                            <button onClick={() => onDelete(category.id)} className="px-2 py-1 bg-rose-500/10 text-rose-400 rounded-lg text-[10px] font-bold">
                                Supprimer
                            </button>
                        </div>
                    </div>

                    {subCats.length > 0 && (
                        <div className="pl-4 border-l-2 border-slate-800 space-y-2 pt-1">
                            {subCats.map(sub => (
                                <CategoryTreeItem key={sub.id} category={sub} categories={categories} depth={depth + 1} onAddChild={onAddChild} onEdit={onEdit} onDelete={onDelete} onMove={onMove} />
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // ====================================================================
        // Application
        // ====================================================================
        function App() {
            const [isAgeVerified, setIsAgeVerified] = useState(false);

            useEffect(() => {
                try {
                    if (localStorage.getItem('vapodor_age_verified') === 'true') setIsAgeVerified(true);
                } catch (e) {}
            }, []);

            const confirmAge = () => {
                try { localStorage.setItem('vapodor_age_verified', 'true'); } catch (e) {}
                setIsAgeVerified(true);
            };

            const [currentView, setCurrentView] = useState('home');
            const [selectedCategoryId, setSelectedCategoryId] = useState(null);
            const [selectedBrandId, setSelectedBrandId] = useState(null);

            const [searchQuery, setSearchQuery] = useState('');
            const [filters, setFilters] = useState(DEFAULT_FILTERS);
            const [showCartModal, setShowCartModal] = useState(false);
            const [selectedProductId, setSelectedProductId] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            const [loadError, setLoadError] = useState('');

            const [brands, setBrands] = useState([]);
            const [categories, setCategories] = useState([]);
            const [products, setProducts] = useState([]);
            const [settings, setSettings] = useState(DEFAULT_SETTINGS);
            const [site, setSite] = useState(mergeSite(null));
            const [pageKey, setPageKey] = useState('');
            const [menuOpen, setMenuOpen] = useState(false);

            // Modèle de prix DIY préconfiguré par volume et par taux de nicotine
            const [diyPresetPrices, setDiyPresetPrices] = useState(() => {
                try {
                    const saved = localStorage.getItem('vapodor_diy_preset_v2');
                    if (saved) return JSON.parse(saved);
                } catch (e) {}
                
                const def = {};
                ['10ml', '30ml', '50ml', '100ml', '200ml', '500ml'].forEach(vol => {
                    ['0mg', '3mg', '6mg'].forEach(nic => {
                        def[`${vol}_${nic}`] = '';
                    });
                });
                return def;
            });

            const hideOutOfStock = settings.hideOutOfStock;
            const isVisible = (p) => !hideOutOfStock || p.variants.some(isInStock);

            const loadDataFromSupabase = async () => {
                setIsLoading(true);
                setLoadError('');
                try {
                    const [bData, cData, pData, vData, sRes] = await Promise.all([
                        fetchAll('brands'),
                        fetchAll('categories'),
                        fetchAll('products'),
                        fetchAll('variants'),
                        supabaseClient.from('settings').select('*').eq('id', 1).maybeSingle()
                    ]);

                    setBrands(bData);
                    setCategories(sortCategories(cData));
                    setProducts(pData.map(p => ({
                        ...p,
                        variants: vData.filter(v => v.product_id === p.id)
                    })));

                    if (sRes.error) {
                        console.warn("Table 'settings' introuvable ou inaccessible :", sRes.error.message);
                    } else if (sRes.data) {
                        setSettings({
                            whatsappNumber: sRes.data.whatsapp_number || DEFAULT_SETTINGS.whatsappNumber,
                            whatsappMessage: sRes.data.whatsapp_message || DEFAULT_SETTINGS.whatsappMessage,
                            messengerUrl: sRes.data.messenger_url || DEFAULT_SETTINGS.messengerUrl,
                            hideOutOfStock: !!sRes.data.hide_out_of_stock
                        });
                        setSite(mergeSite(sRes.data.site));
                    }
                } catch (err) {
                    console.error("Erreur de chargement :", err);
                    setLoadError(err.message || 'Impossible de charger le catalogue.');
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                loadDataFromSupabase();
            }, []);

            const [adminUnlocked, setAdminUnlocked] = useState(false);
            useEffect(() => {
                supabaseClient.auth.getSession().then(({ data }) => setAdminUnlocked(!!data?.session));
                const { data: sub } = supabaseClient.auth.onAuthStateChange((_event, session) => setAdminUnlocked(!!session));
                return () => sub?.subscription?.unsubscribe();
            }, []);

            useEffect(() => {
                const handlePopState = (event) => {
                    setSelectedProductId(null);
                    setFilters(DEFAULT_FILTERS);
                    if (event.state) {
                        setCurrentView(event.state.view || 'home');
                        setSelectedCategoryId(event.state.categoryId || null);
                        setSelectedBrandId(event.state.brandId || null);
                        setSearchQuery(event.state.searchQuery || '');
                        setPageKey(event.state.pageKey || '');
                    } else {
                        setCurrentView('home');
                        setSelectedCategoryId(null);
                        setSelectedBrandId(null);
                        setSearchQuery('');
                    }
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            const navigateTo = (view, catId = null, brandId = null, query = '') => {
                window.history.pushState({ view, categoryId: catId, brandId, searchQuery: query }, '', `#${view}`);
                setFilters(DEFAULT_FILTERS);
                setSelectedProductId(null);
                setCurrentView(view);
                setSelectedCategoryId(catId);
                setSelectedBrandId(brandId);
                if (query !== '') setSearchQuery(query);
                window.scrollTo(0, 0);
            };

            const openPage = (key) => {
                window.history.pushState({ view: 'page', pageKey: key }, '', `#${key}`);
                setSelectedProductId(null);
                setCurrentView('page');
                setPageKey(key);
                window.scrollTo(0, 0);
            };

            const openProduct = (id) => {
                setSelectedProductId(id);
                try { window.history.replaceState(window.history.state, '', `#produit/${encodeURIComponent(id)}`); } catch (e) {}
            };
            const closeProduct = () => {
                setSelectedProductId(null);
                try { window.history.replaceState(window.history.state, '', `#${currentView}`); } catch (e) {}
            };
            const copyProductLink = async () => {
                const url = window.location.href;
                try {
                    await navigator.clipboard.writeText(url);
                    alert('Lien du produit copié !');
                } catch (e) {
                    prompt('Copiez le lien de ce produit :', url);
                }
            };

            const deepLinkDone = useRef(false);
            useEffect(() => {
                if (deepLinkDone.current || isLoading || products.length === 0) return;
                deepLinkDone.current = true;
                const m = window.location.hash.match(/^#produit\/(.+)$/);
                if (m) {
                    const id = decodeURIComponent(m[1]);
                    if (products.some(p => String(p.id) === id)) setSelectedProductId(products.find(p => String(p.id) === id).id);
                }
            }, [isLoading, products]);

            const handleSearchSubmit = (e) => {
                e.preventDefault();
                if (searchQuery.trim()) {
                    navigateTo('search', null, null, searchQuery);
                }
            };

            const [cart, setCart] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('vapodor_cart') || '[]');
                    return Array.isArray(saved) ? saved : [];
                } catch (e) { return []; }
            });
            useEffect(() => {
                try { localStorage.setItem('vapodor_cart', JSON.stringify(cart)); } catch (e) {}
            }, [cart]);

            const [cartNotice, setCartNotice] = useState(null);
            const [selectedVariantByProduct, setSelectedVariantByProduct] = useState({});
            const [quantityByProduct, setQuantityByProduct] = useState({});

            const onSelectVariant = (productId, variantId) => setSelectedVariantByProduct(prev => ({ ...prev, [productId]: variantId }));
            const onQty = (productId, qty) => setQuantityByProduct(prev => ({ ...prev, [productId]: qty }));

            const cartLines = cart.map(item => {

                    if (isSet(l.variant.volume_ml)) details.push(l.variant.volume_ml);
                    if (isSet(l.variant.nicotine_level)) details.push(`Nic: ${l.variant.nicotine_level}`);
                    if (isSet(l.variant.ohm_value)) details.push(l.variant.ohm_value);
                    if (isSet(l.variant.color_finish)) details.push(l.variant.color_finish);
                    text += `- ${l.product.name} (${l.quantity}x)${details.length ? ` [${details.join(' | ')}]` : ''} - ${fmt(l.variant.price * l.quantity)} Ar\n`;

                text += `\nTotal : *${fmt(cartTotal)} Ar*`;

            // Recherche automatique sur internet (fonction Supabase "product-lookup")
            const lookupProductInfo = async () => {
                const name = (newProduct.name || '').trim();
                if (name.length < 2) return alert("Saisissez d'abord le nom du produit.");
                setLookupBusy(true);
                setLookupInfo(null);
                try {
                    const { data: sess } = await supabaseClient.auth.getSession();
                    const token = sess?.session?.access_token;
                    if (!token) return alert("Session expirée : reconnectez-vous à l'administration.");

                    const types = Object.fromEntries(Object.entries(PRODUCT_TYPES).map(([k, t]) => [k, { label: t.label, fields: t.fields.map(f => f.label) }]));
                    const res = await fetch(LOOKUP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, apikey: SUPABASE_ANON_KEY },
                        body: JSON.stringify({
                            name,
                            brand: brands.find(b => b.id === newProduct.brand_id)?.name || '',
                            category: categories.find(c => c.id === newProduct.category_id)?.name || '',
                            types
                        })
                    });
                    let payload = null;
                    try { payload = await res.json(); } catch (e) {}
                    if (res.status === 404) return alert("La recherche automatique n'est pas encore installée sur Supabase (fonction « product-lookup »). Utilisez la recherche manuelle en attendant.");
                    if (!res.ok || !payload?.ok) return alert('Recherche impossible : ' + (payload?.error || ('erreur ' + res.status)));

                    const d = payload.data || {};
                    const items = [];
                    const matchedBrand = d.brand ? brands.find(b => norm(b.name) === norm(d.brand)) : null;
                    if (matchedBrand) items.push({ key: 'brand', label: 'Marque', value: matchedBrand.name, checked: true });
                    if (d.short_description) items.push({ key: 'desc', label: 'Description', value: d.short_description, checked: true });
                    (d.specs || []).forEach(sp => items.push({ key: 'spec', label: sp.label, value: sp.value, checked: true }));
                    if (d.box_content) items.push({ key: 'box', label: 'Contenu de la boîte', value: d.box_content, checked: true });

                    setLookupInfo({ sources: payload.sources || [], confidence: d.confidence || 'low', notes: d.notes || '', brandName: !matchedBrand ? (d.brand || '') : '' });
                    if (items.length === 0) return alert("Aucune information trouvée pour ce nom. Essayez avec le nom complet (marque + modèle).");
                    setSpecImportType(d.type && PRODUCT_TYPES[d.type] ? d.type : '');
                    setSpecImportItems(items);
                } catch (err) {
                    alert('Erreur de connexion : ' + err.message);
                } finally {
                    setLookupBusy(false);
                }
            };

            const applySpecImport = () => {

                setNewProduct(prev => {

                    let box = prev.box_content;

                    chosen.forEach(it => {
                        if (it.key === 'desc') { if (!String(desc || '').trim()) desc = it.value; return; }
                        if (it.key === 'brand') { const b = brands.find(x => norm(x.name) === norm(it.value)); if (b && !brandId) brandId = b.id; return; }
                        if (it.key === 'box') { if (!String(box || '').trim()) box = it.value; return; }
                        const idx = specs.findIndex(sp => norm(sp.label) === norm(it.label));
                        if (idx >= 0) { if (!String(specs[idx].value || '').trim()) specs[idx].value = it.value; }
                        else specs.push({ label: it.label, value: it.value });
                    });
                    return { ...prev, specs, box_content: box, short_description: desc, brand_id: brandId, product_type: prev.product_type || specImportType || '' };

            const generateDiyVariants = () => {
                const activeVolumes = Object.keys(diySelectedVolumes).filter(k => diySelectedVolumes[k]);
                const activeNicotines = Object.keys(diySelectedNicotines).filter(k => diySelectedNicotines[k]);

                if (activeVolumes.length === 0 && activeNicotines.length === 0) {

                }
